<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:11434 http://localhost:11434; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>MoDooDa Agent</title>
  <meta name="description" content="Let AI agents collaborate: ChatGPT, Claude and others talk to each other and respond with the best option.">
  <meta name="theme-color" content="#6a48d4">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoDooDa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="../styles.css">
  <script src="app.js" defer></script>
</head>
<body class="app">
  <header class="topbar">
    <div class="wrap">
      <div id="stage-slot" class="stage-slot"></div>
      <button class="ghost icon" id="btn-settings" type="button" aria-haspopup="dialog" aria-label="Settings" title="Settings">⚙︎</button>
    </div>
  </header>
  <main class="wrap app-main" id="main" tabindex="-1">
    <noscript><div class="card">MoDooDa needs JavaScript to run. Nothing you type is sent anywhere by this app.</div></noscript>
  </main>
  <div class="composer-wrap" id="composer-wrap">
    <div class="wrap">
      <form class="composer" id="composer" autocomplete="off">
        <div class="attach-list" id="attach-list"></div>
        <label for="composer-input" class="sr-only">Your task</label>
        <textarea id="composer-input" rows="4" placeholder="Type your task."></textarea>
        <div class="bar">
          <button type="button" class="ghost icon" id="btn-attach" aria-label="Attach files" title="Attach files (PDF, Word, text)">📎</button>
          <input type="file" id="file-input" class="sr-only" multiple aria-label="Attach files">
          <span class="spacer"></span>
          <button type="submit" class="primary send" id="btn-send" aria-label="Start">Start</button>
        </div>
      </form>
      <div class="composer-meta" id="composer-meta"></div>
    </div>
  </div>
  <footer class="app-foot"><div class="wrap"><span>© 2026 Myoungmee Babu</span></div></footer>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
