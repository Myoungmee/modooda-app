<!-- MoDooDa's file-making sandbox. It runs in a sandboxed frame (no cookies, storage or access to
     the app), and the code an AI writes runs in a worker here with no network at all. -->

<title>MoDooDa file maker</title>
<script src="sandbox.js"></script>
</head>

</html>
